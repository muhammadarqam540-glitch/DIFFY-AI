<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Diffy AI — Understand the Difference. Master the Knowledge.</title>
  <meta name="description" content="Personal AI teacher transforming academic comparisons into structured, interactive, visually rich educational lessons with animations and quizzes.">
  <meta name="theme-color" content="#080c17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M12 2L2 7l10 5 10-5-10-5z'/><path d='M2 17l10 5 10-5'/><path d='M2 12l10 5 10-5'/></svg>">
  <link rel="stylesheet" href="/src/styles/main.css">
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <!-- Ambient Cosmic Lighting Mesh -->
  <div class="ambient-mesh">
    <div class="ambient-blob-1"></div>
    <div class="ambient-blob-2"></div>
  </div>

  <!-- Global Header Navigation Mount -->
  <div id="navbar-root"></div>

  <!-- Primary Application Container -->
  <main class="container" style="padding-top: 16px; padding-bottom: 80px;">
    <div id="main-content">
      <!-- Dynamically switched between Dashboard and Structured Lesson -->
    </div>
  </main>

  <!-- Application Entry Point -->
  <script type="module" src="/src/app.js"></script>
</body>
</html>
